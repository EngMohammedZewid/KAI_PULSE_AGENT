<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KAI Pulse</title>
<style>
  :root {
    --bg: #f6f7f9; --panel: #ffffff; --text: #1d2330; --muted: #5b6475; --line: #dde1e8;
    --accent: #2563eb; --accent-text: #ffffff; --user: #e8effd; --error: #b42318;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #12151b; --panel: #1a1f27; --text: #e6e9ef; --muted: #9aa3b2; --line: #2b323d;
            --accent: #4f8cff; --accent-text: #0b0e13; --user: #1f2b44; --error: #ff8a80; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 15px/1.5 system-ui, -apple-system, "Segoe UI", "Noto Sans Arabic", sans-serif;
         background: var(--bg); color: var(--text); height: 100vh; display: flex; }
  button, input, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; border: 1px solid var(--line); background: var(--panel); border-radius: 8px; padding: 6px 12px; }
  button.primary { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }
  button:disabled { opacity: .5; cursor: default; }
  aside { width: 260px; border-right: 1px solid var(--line); background: var(--panel); display: flex; flex-direction: column; }
  aside header { padding: 16px; border-bottom: 1px solid var(--line); }
  aside h1 { font-size: 17px; margin: 0 0 2px; }
  #who { color: var(--muted); font-size: 13px; }
  #threads { list-style: none; margin: 0; padding: 8px; overflow-y: auto; flex: 1; }
  #threads li { padding: 8px 10px; border-radius: 8px; cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #threads li.active, #threads li:hover { background: var(--user); }
  main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  #log { flex: 1; overflow-y: auto; padding: 24px; display: flex; flex-direction: column; gap: 14px; }
  .msg { max-width: 760px; padding: 10px 14px; border-radius: 12px; background: var(--panel); border: 1px solid var(--line); overflow-wrap: anywhere; }
  .msg.user { align-self: flex-end; background: var(--user); border-color: transparent; }
  .msg > :first-child { margin-top: 0; } .msg > :last-child { margin-bottom: 0; }
  .msg p { margin: 0 0 8px; }
  .msg h3, .msg h4, .msg h5, .msg h6 { margin: 12px 0 6px; line-height: 1.3; }
  .msg h3 { font-size: 17px; } .msg h4 { font-size: 15px; } .msg h5, .msg h6 { font-size: 14px; }
  .msg ul, .msg ol { margin: 0 0 8px; padding-inline-start: 22px; }
  .msg li { margin: 2px 0; }
  .msg blockquote { margin: 0 0 8px; padding: 6px 12px; border-inline-start: 3px solid var(--accent); background: var(--bg); border-radius: 6px; }
  .msg hr { border: 0; border-top: 1px solid var(--line); margin: 10px 0; }
  .msg code { font: 13px ui-monospace, Consolas, monospace; background: var(--bg); padding: 1px 4px; border-radius: 4px; }
  .msg .table { overflow-x: auto; margin: 0 0 8px; }
  .msg table { border-collapse: collapse; font-size: 14px; }
  .msg th, .msg td { border: 1px solid var(--line); padding: 4px 8px; text-align: start; }
  .msg th { background: var(--bg); }
  .msg img { max-width: 100%; border-radius: 8px; margin: 6px 0; background: #fff; }
  .msg .files { color: var(--muted); font-size: 13px; margin-top: 4px; }
  .msg:has(.chart-card) { width: min(760px, 100%); }
  .chart-card { margin: 8px 0 10px; padding: 12px 14px 8px; border: 1px solid var(--line); border-radius: 10px; background: var(--panel); }
  .chart-title { font-weight: 600; font-size: 14px; margin: 0 0 6px; }
  .chart-legend { display: flex; flex-wrap: wrap; gap: 6px; margin: 0 0 8px; }
  .chart-key { display: inline-flex; align-items: center; gap: 6px; padding: 2px 8px; font-size: 12px; color: var(--muted); border-radius: 6px; }
  .chart-key.off { opacity: .45; text-decoration: line-through; }
  .chart-swatch { width: 10px; height: 10px; border-radius: 2px; display: inline-block; }
  .chart-area { position: relative; width: 100%; }
  .chart-actions { display: flex; justify-content: flex-end; gap: 12px; font-size: 12px; margin-top: 4px; }
  .chart-actions a { color: var(--muted); }
  .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px; margin: 0 0 10px; }
  .kpi { background: var(--bg); border-radius: 8px; padding: 10px 12px; }
  .kpi-label { font-size: 12px; color: var(--muted); }
  .kpi-value { font-size: 19px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .kpi.bad .kpi-value { color: var(--error); }
  .msg.error { color: var(--error); }
  .question { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
  .rate { display: flex; gap: 4px; margin-top: 6px; }
  .rate button { padding: 2px 8px; font-size: 13px; color: var(--muted); }
  .rate button.on { border-color: var(--accent); color: var(--accent); }
  form { display: flex; gap: 8px; padding: 12px 24px 20px; border-top: 1px solid var(--line); background: var(--panel); align-items: flex-end; }
  textarea { flex: 1; resize: none; min-height: 44px; max-height: 160px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--bg); }
  #picked { color: var(--muted); font-size: 13px; padding: 0 24px; background: var(--panel); }
  #signin { margin: auto; max-width: 420px; padding: 24px; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; }
  #signin input { width: 100%; padding: 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); margin: 12px 0; }
  .hidden { display: none !important; }
  @media (max-width: 720px) { aside { display: none; } #log { padding: 16px; } form { padding: 12px 16px; } }
</style>
<script src="/static/vendor/chart.umd.js"></script>
<script src="/static/charts.js"></script>
</head>
<body>
<div id="signin" class="hidden">
  <h1>KAI Pulse</h1>
  <p>Paste the API token your administrator gave you.</p>
  <input id="token" type="password" autocomplete="off" placeholder="kai_...">
  <button class="primary" id="signin-btn">Sign in</button>
  <p id="signin-error" class="msg error hidden"></p>
</div>

<aside id="side" class="hidden">
  <header>
    <h1>KAI Pulse</h1>
    <div id="who"></div>
  </header>
  <div style="padding:8px"><button class="primary" id="new-thread" style="width:100%">New conversation</button></div>
  <ul id="threads"></ul>
  <div style="padding:8px"><button id="signout" style="width:100%">Sign out</button></div>
</aside>

<main id="chat" class="hidden">
  <div id="log" aria-live="polite"></div>
  <div id="picked"></div>
  <form id="composer">
    <input type="file" id="file" multiple hidden accept=".csv,.xlsx,.xls,.pdf,.txt,.md,.json,.xml,.yaml,.yml,.png,.jpg,.jpeg,.gif">
    <button type="button" id="attach" title="Attach files">Attach</button>
    <textarea id="text" placeholder="Message KAI Pulse…" title="Enter to send, Shift+Enter for a new line" rows="1"></textarea>
    <button class="primary" id="send" type="submit">Send</button>
  </form>
</main>

<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const store = {
    get() { try { return localStorage.getItem("kai_token") || ""; } catch { return ""; } },
    set(v) { try { v ? localStorage.setItem("kai_token", v) : localStorage.removeItem("kai_token"); } catch {} },
  };
  let token = store.get(), current = null, busy = false;
  const current_thread = () => current;

  async function api(path, opts = {}) {
    const res = await fetch(path, { ...opts, headers: { ...(opts.headers || {}), Authorization: `Bearer ${token}` } });
    if (res.status === 401) { signOut(); throw new Error("Your token is not valid."); }
    const body = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(body.detail || `Request failed (${res.status})`);
    return body;
  }

  // Escape everything, then turn back on only https images and links.
  function render(text) {
    const esc = (s) => s.replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    let html = esc(text);
    // URLs stay HTML-escaped (&amp;), which is valid inside an attribute; &quot; ends them.
    html = html.replace(/&lt;img src=&quot;(https:\/\/\S+?)&quot;[^]*?\/?&gt;/g, (_, u) => `<img src="${u}" alt="chart">`);
    html = html.replace(/&lt;a href=&quot;(https:\/\/\S+?)&quot;&gt;([^]*?)&lt;\/a&gt;/g, (_, u, t) => `<a href="${u}" target="_blank" rel="noopener">${t}</a>`);
    html = html.replace(/!\[([^\]]*)\]\((https:\/\/[^)\s]+)\)/g, (_, a, u) => `<img src="${u}" alt="${a}">`);
    html = html.replace(/\[([^\]]+)\]\((https:\/\/[^)\s]+)\)/g, (_, t, u) => `<a href="${u}" target="_blank" rel="noopener">${t}</a>`);
    html = html.replace(/(^|[\s(])(https:\/\/[^\s<)"]+)/g, (_, p, u) => `${p}<a href="${u}" target="_blank" rel="noopener">${u.length > 60 ? u.slice(0, 57) + "…" : u}</a>`);
    html = html.replace(/\*\*([^*\n]+)\*\*/g, "<strong>$1</strong>");
    html = html.replace(/`([^`\n]+)`/g, "<code>$1</code>");
    return blocks(html);
  }

  // Line-level Markdown on already-escaped text: headings, lists, quotes, rules, tables.
  function blocks(html) {
    const lines = html.split("\n"), out = [];
    const cells = (l) => l.trim().replace(/^\||\|$/g, "").split("|").map((c) => c.trim());
    let para = [];
    const flush = () => { if (para.length) { out.push(`<p dir="auto">${para.join("<br>")}</p>`); para = []; } };
    for (let i = 0; i < lines.length; i++) {
      const line = lines[i];
      let m;
      if (!line.trim()) { flush(); continue; }
      if ((m = line.match(/^\s*(#{1,6})\s+(.*?)\s*#*\s*$/))) {
        flush(); const n = Math.min(m[1].length + 2, 6);
        out.push(`<h${n} dir="auto">${m[2]}</h${n}>`); continue;
      }
      if (/^\s*([-*_])(\s*\1){2,}\s*$/.test(line)) { flush(); out.push("<hr>"); continue; }
      if (/^\s*\|.*\|\s*$/.test(line) && /^\s*\|?\s*:?-{3,}/.test(lines[i + 1] || "")) {
        flush(); const head = cells(line), rows = [];
        i += 2;
        while (i < lines.length && /^\s*\|/.test(lines[i])) rows.push(cells(lines[i++]));
        i--;
        out.push(`<div class="table"><table dir="auto"><thead><tr>${head.map((c) => `<th>${c}</th>`).join("")}</tr></thead>` +
                 `<tbody>${rows.map((r) => `<tr>${r.map((c) => `<td>${c}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`);
        continue;
      }
      const list = (re, tag) => {
        if (!re.test(line)) return false;
        flush(); const items = [];
        while (i < lines.length && re.test(lines[i])) items.push(lines[i++].replace(re, ""));
        i--;
        out.push(`<${tag} dir="auto">${items.map((t) => `<li>${t}</li>`).join("")}</${tag}>`);
        return true;
      };
      if (list(/^\s*[-*+]\s+/, "ul") || list(/^\s*\d+[.)]\s+/, "ol")) continue;
      if (/^\s*&gt;\s?/.test(line)) {
        flush(); const q = [];
        while (i < lines.length && /^\s*&gt;\s?/.test(lines[i])) q.push(lines[i++].replace(/^\s*&gt;\s?/, ""));
        i--;
        out.push(`<blockquote dir="auto">${q.join("<br>")}</blockquote>`); continue;
      }
      para.push(line);
    }
    flush();
    return out.join("");
  }

  function addRating(div, index, current) {
    const row = document.createElement("div");
    row.className = "rate";
    const buttons = {};
    for (const [rating, label, title] of [["up", "👍", "Helpful"], ["down", "👎", "Not helpful"]]) {
      const b = document.createElement("button");
      b.textContent = label;
      b.title = title;
      b.setAttribute("aria-label", title);
      b.onclick = async () => {
        let comment = "";
        if (rating === "down") comment = window.prompt("What went wrong? (optional)") || "";
        try {
          await api(`/api/threads/${current_thread()}/feedback`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ message_index: index, rating, comment }),
          });
          for (const [r, btn] of Object.entries(buttons)) btn.classList.toggle("on", r === rating);
        } catch (e) { showError(e); }
      };
      buttons[rating] = b;
      row.appendChild(b);
    }
    if (current === 1) buttons.up.classList.add("on");
    if (current === -1) buttons.down.classList.add("on");
    div.appendChild(row);
  }

  function addMessage(m, rating) {
    const div = document.createElement("div");
    div.className = `msg ${m.role}`;
    div.dir = "auto";
    div.innerHTML = render(m.content || "");
    if (m.role === "assistant" && window.KaiCharts) window.KaiCharts.enhance(div, m);
    if (m.attachments && m.attachments.length) {
      const f = document.createElement("div");
      f.className = "files";
      f.textContent = "Attached: " + m.attachments.join(", ");
      div.appendChild(f);
    }
    if (m.role === "assistant" && Number.isInteger(m.index)) addRating(div, m.index, rating);
    $("log").appendChild(div);
    $("log").scrollTop = $("log").scrollHeight;
    return div;
  }

  function showQuestion(q) {
    if (!q) return;
    const div = addMessage({ role: "assistant", content: q.question || "" });
    if (q.type === "report_format") {
      const row = document.createElement("div");
      row.className = "question";
      for (const [label, answer] of [["PDF", "pdf"], ["Word (.docx)", "docx"]]) {
        const b = document.createElement("button");
        b.textContent = label;
        b.onclick = () => { row.remove(); resume(answer); };
        row.appendChild(b);
      }
      div.appendChild(row);
    }
  }

  function showError(e) { addMessage({ role: "assistant", content: e.message }).classList.add("error"); }

  function setBusy(b) {
    busy = b;
    for (const id of ["send", "attach", "new-thread"]) $(id).disabled = b;
    $("send").textContent = b ? "Thinking…" : "Send";
  }

  async function loadThreads() {
    const threads = await api("/api/threads");
    const ul = $("threads");
    ul.innerHTML = "";
    for (const t of threads) {
      const li = document.createElement("li");
      li.textContent = t.title;
      li.title = t.title;
      li.className = t.id === current ? "active" : "";
      li.onclick = () => openThread(t.id);
      ul.appendChild(li);
    }
    return threads;
  }

  async function openThread(id) {
    current = id;
    if (window.KaiCharts) window.KaiCharts.reset();
    $("log").innerHTML = "";
    const data = await api(`/api/threads/${id}`);
    data.messages.forEach((m) => addMessage(m, (data.feedback || {})[m.index]));
    showQuestion(data.interrupt);
    await loadThreads();
  }

  async function newThread() {
    const t = await api("/api/threads", { method: "POST", headers: { "Content-Type": "application/json" }, body: "{}" });
    await openThread(t.id);
  }

  async function send(e) {
    e.preventDefault();
    if (busy) return;
    const text = $("text").value.trim(), files = [...$("file").files];
    if (!text && !files.length) return;
    if (!current) await newThread();
    addMessage({ role: "user", content: text, attachments: files.map((f) => f.name) });
    const form = new FormData();
    form.append("text", text);
    files.forEach((f) => form.append("files", f));
    $("text").value = ""; $("file").value = ""; $("picked").textContent = "";
    setBusy(true);
    try {
      const r = await api(`/api/threads/${current}/messages`, { method: "POST", body: form });
      r.messages.forEach(addMessage);
      showQuestion(r.interrupt);
      loadThreads();
    } catch (err) { showError(err); } finally { setBusy(false); $("text").focus(); }
  }

  async function resume(answer) {
    setBusy(true);
    try {
      const r = await api(`/api/threads/${current}/resume`, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ answer }) });
      r.messages.forEach(addMessage);
      showQuestion(r.interrupt);
    } catch (err) { showError(err); } finally { setBusy(false); }
  }

  function signOut() { token = ""; store.set(""); current = null; show(false); }

  async function show(signedIn) {
    $("signin").classList.toggle("hidden", signedIn);
    $("side").classList.toggle("hidden", !signedIn);
    $("chat").classList.toggle("hidden", !signedIn);
    if (!signedIn) return;
    const me = await api("/api/me");
    $("who").textContent = me.name;
    const threads = await loadThreads();
    if (threads.length) await openThread(threads[0].id);
  }

  async function signIn() {
    token = $("token").value.trim();
    $("signin-error").classList.add("hidden");
    try { await show(true); store.set(token); $("token").value = ""; }
    catch (e) { $("signin-error").textContent = e.message; $("signin-error").classList.remove("hidden"); show(false); }
  }

  $("signin-btn").onclick = signIn;
  $("token").addEventListener("keydown", (e) => { if (e.key === "Enter") signIn(); });
  $("signout").onclick = signOut;
  $("new-thread").onclick = () => newThread().catch(showError);
  $("attach").onclick = () => $("file").click();
  $("file").onchange = () => { $("picked").textContent = [...$("file").files].map((f) => f.name).join(", "); };
  $("composer").addEventListener("submit", send);
  $("text").addEventListener("keydown", (e) => { if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); $("composer").requestSubmit(); } });

  show(Boolean(token)).catch(() => show(false));
})();
</script>
</body>
</html>
